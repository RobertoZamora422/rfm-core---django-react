name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip check
      - run: python -I -B -u run_ci_checks.py check
      - run: python -I -B -u run_ci_checks.py makemigrations
      - run: python -I -B -u run_ci_checks.py test
      - name: Check production settings
        env:
          CORS_ALLOWED_ORIGINS: https://ranchoflormaria.com
          CSRF_TRUSTED_ORIGINS: https://ranchoflormaria.com
          DATABASE_URL: postgresql://audit@127.0.0.1:65432/rfm_audit
          DJANGO_ALLOWED_HOSTS: rfm-core-backend.onrender.com
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: ci-only-safe-deployment-check-key-with-more-than-fifty-characters
          FRONTEND_PUBLIC_URL: https://ranchoflormaria.com
          PYTHON_DOTENV_DISABLED: '1'
        run: python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: https://rfm-core-backend.onrender.com/api
      VITE_API_TIMEOUT_MS: '15000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Validate Workers SPA configuration
        run: |
          test ! -e public/_redirects
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('./dist/wrangler.json','utf8')); if(c.workers_dev!==false || c.preview_urls!==false || c.assets?.not_found_handling!=='single-page-application') process.exit(1)"
      - run: npx wrangler deploy --dry-run
